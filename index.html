<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마우스 오버 컬러 비디오 갤러리</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
        }

    .video-gallery {
        display: grid;
        /* 핵심 수정: 한 줄에 무조건 5개씩 (최소 150px 유지하며) */
        grid-template-columns: repeat(5, 1fr); 
        gap: 15px; /* 간격을 살짝 좁혔어요 */
        max-width: 1400px; /* 5개가 들어가므로 전체 폭을 조금 넓혔습니다 */
        width: 100%;
    }

    .video-container {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        background-color: #000;
        aspect-ratio: 9 / 16; /* 쇼츠 비율 유지 */
        width: 100%;
    }

/* 모바일에서는 5개가 너무 작으므로 2개씩 보이게 조절 */
    @media (max-width: 768px) {
        .video-gallery {
            grid-template-columns: repeat(2, 1fr);
        }
    }

.video-container iframe {
    width: 100%;
    height: 100%; /* 부모 컨테이너에 꽉 차게 */
    border: none;
    filter: grayscale(100%);
    transition: filter 0.5s ease;
}

.video-container:hover iframe {
    filter: grayscale(0%);
}

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%); /* 기본적으로 흑백 */
            transition: filter 0.5s ease; /* 흑백->컬러 전환 애니메이션 */
            cursor: pointer;
        }

        .video-container:hover video {
            filter: grayscale(0%); /* 마우스 오버 시 컬러 */
        }

        .video-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            color: white;
            padding: 15px 10px;
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover .video-title {
            opacity: 1;
        }

    /* 모바일용 스타일 수정: 화면 너비가 768px 이하일 때 적용 */
    @media (max-width: 768px) {
        .video-gallery {
            /* 한 줄에 3개씩 배치 */
            grid-template-columns: repeat(3, 1fr);
            /* 모바일에서는 간격이 너무 넓으면 영상이 작아지므로 간격을 살짝 조절 */
            gap: 8px; 
        }

        .video-title {
            /* 모바일에서는 제목 글씨 크기를 더 줄여서 영상이 잘 보이게 함 */
            font-size: 0.7em;
            padding: 8px 5px;
        }

        h1 {
            /* 모바일에서 제목 크기 조절 */
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>당신의 버킷리스트는 무엇인가요?</h1>

    <div class="video-gallery" id="videoGallery">
        </div>

   <script>
    const videos = [
        { id: "JkFTVoqZpRo", title: "짜릿한 스피드" },
        { id: "OKiU0HFeD-s", title: "헬기스키" },
        { id: "lFOQjrpvtgs", title: "사파리" },
{ id: "-Yq3v9Kn33E", title: "운하통과"},
{ id: "XdWeCOiUmtM", title: "작가후원"},
{ id: "eZWvKOuZnq0", title: "개인공연"},
{ id: "DcAdqPJzqDA", title: "개인갤러리"},
{ id: "Hb6AH0lA1zQ", title: "학교설립"},
{ id: "g37su0g5500", title: "장학금"},
{ id: "TtvaXUI7wkI", title: "경영권승계"},
{ id: "UVdVKlMWOmE", title: "우주여행"},
{ id: "ig6znci8jF4", title: "남극여행"},
{ id: "KXGU7uBW3Kg", title: "요트항해"},
{ id: "BoQq4P_Rx-g", title: "극지탐험"},
{ id: "byN0MuBGLi0", title: "프라이빗 아일랜드"},
{ id: "q-CkgB5XObg", title: "F1"},
{ id: "kQKEnn2oalA", title: "소믈리에"},
{ id: "WZ4OG-nbL64", title: "가문파티"},
{ id: "2szdNrBqeMI", title: "바디화보"},
{ id: "X6a0Q85u2QU", title: "학위수여"},
 
    ];

   const videoGallery = document.getElementById('videoGallery');

    videos.forEach(videoData => {
        const videoContainer = document.createElement('div');
        videoContainer.className = 'video-container';

        const iframe = document.createElement('iframe');
        
        // 최적화 포인트: loading=lazy 추가, 무거운 기능(JS API 등) 최소화
        // iv_load_policy=3은 비디오 어노테이션을 꺼서 로딩을 줄입니다.
        iframe.src = `https://www.youtube.com/embed/${videoData.id}?autoplay=1&mute=1&loop=1&playlist=${videoData.id}&controls=0&modestbranding=1&iv_load_policy=3&rel=0`;
        
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        
        // 핵심: 지연 로딩 속성 추가
        iframe.setAttribute('loading', 'lazy'); 
        iframe.setAttribute('allow', 'autoplay; encrypted-media');

        const videoTitle = document.createElement('div');
        videoTitle.className = 'video-title';
        videoTitle.textContent = videoData.title;

        videoContainer.appendChild(iframe);
        videoContainer.appendChild(videoTitle);
        videoGallery.appendChild(videoContainer);
    });
</script>
</body>
</html>
