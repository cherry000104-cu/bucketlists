<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONO WAVE | Life in Wave</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f7f4; /* 양장본 종이 질감 색상 */
            --point-color: #1a2a40; /* 소노웨이브 딥 네이비 */
            --accent-color: #c5a36b; /* 샴페인 골드 */
            --text-color: #333;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Noto Serif KR', serif;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }

        /* 헤더 문구 */
        .prologue-text {
            font-size: 1.5rem;
            line-height: 1.8;
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }

        .prologue-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 98 컬렉션 아이템 스타일 */
        .wave-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .wave-item {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .wave-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .wave-item.selected {
            background-color: var(--point-color);
            color: #fff;
            border-color: var(--point-color);
        }

        /* 하단 플로팅 바 (Your Waves) */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #ddd;
            padding: 20px 0;
            transform: translateY(100%);
            transition: transform 0.5s ease;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .bottom-bar.active {
            transform: translateY(0);
        }

        .flex-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        input[type="email"] {
            padding: 12px 20px;
            width: 250px;
            border: 1px solid #ddd;
            font-family: inherit;
        }

        .btn-email {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn-email:hover {
            background: #b08e5a;
        }

        /* 파동 애니메이션 효과 */
        .wave-effect {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(197, 163, 107, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: wave-anim 0.6s ease-out;
        }

        @keyframes wave-anim {
            to { transform: scale(30); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="intro" class="prologue-text">
        당신의 가슴 속 파도는 무엇인가요?<br>
        <span style="font-size: 1.1rem; color: #777;">소노가 엄선한 98가지 시그니처 중 당신의 물결을 골라보세요.</span>
    </div>

    <div class="wave-grid" id="grid">
        </div>
</div>

<div class="bottom-bar" id="bottomBar">
    <div class="flex-row">
        <div id="counter">선택된 파동: 0개</div>
        <div>
            <input type="email" id="userEmail" placeholder="리포트를 받을 이메일 주소">
            <button class="btn-email" onclick="sendEmail()">Email Me</button>
        </div>
    </div>
</div>

<script>
    // 98가지 리스트 중 대표 샘플 데이터 (CSV 기반)
    const collection = [
        { id: 1, title: "철인 3종 경기 공식 완주", type: "Challenge" },
        { id: 2, title: "가문 헌장 & 디지털 아카이브 구축", type: "Legacy" },
        { id: 3, title: "민간 우주 비행 체험", type: "Experience" },
        { id: 4, title: "개인 미술 작품 갤러리 전시", type: "Creative" },
        { id: 5, title: "손자녀와 함께하는 자연 액티비티", type: "Life" },
        { id: 6, title: "전문 분야 석·박사 학위 취득", type: "Growth" }
    ];

    const selectedItems = new Set();
    const grid = document.getElementById('grid');
    const bottomBar = document.getElementById('bottomBar');
    const counter = document.getElementById('counter');

    // 초기 화면 애니메이션
    window.onload = () => {
        document.getElementById('intro').classList.add('show');
        renderGrid();
    };

    function renderGrid() {
        collection.forEach(item => {
            const div = document.createElement('div');
            div.className = 'wave-item';
            div.innerHTML = `<small>${item.type}</small><br><strong>${item.title}</strong>`;
            div.onclick = (e) => toggleSelect(div, item, e);
            grid.appendChild(div);
        });
    }

    function toggleSelect(element, item, event) {
        // 파동 효과 생성
        const wave = document.createElement('div');
        wave.className = 'wave-effect';
        wave.style.left = event.offsetX + 'px';
        wave.style.top = event.offsetY + 'px';
        element.appendChild(wave);
        setTimeout(() => wave.remove(), 600);

        if (selectedItems.has(item.title)) {
            selectedItems.delete(item.title);
            element.classList.remove('selected');
        } else {
            selectedItems.add(item.title);
            element.classList.add('selected');
        }

        updateUI();
    }

    function updateUI() {
        counter.innerText = `선택된 파동: ${selectedItems.size}개`;
        if (selectedItems.size > 0) {
            bottomBar.classList.add('active');
        } else {
            bottomBar.classList.remove('active');
        }
    }

    function sendEmail() {
        const email = document.getElementById('userEmail').value;
        if (!email) { alert("이메일을 입력해주세요."); return; }
        
        const list = Array.from(selectedItems).join(', ');
        alert(`${email}님께 당신의 파동 리포트가 발송되었습니다!\n선택 항목: ${list}`);
        // 실제 운영 시에는 여기서 구글 시트나 이메일 API로 데이터를 전송합니다.
    }
</script>

</body>
</html>
